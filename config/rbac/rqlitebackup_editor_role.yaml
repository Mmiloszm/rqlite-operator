# This rule is not used by the project rqlite-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the rqlite.example.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: rqlite-operator
    app.kubernetes.io/managed-by: kustomize
  name: rqlitebackup-editor-role
rules:
- apiGroups:
  - rqlite.example.com
  resources:
  - rqlitebackups
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - rqlite.example.com
  resources:
  - rqlitebackups/status
  verbs:
  - get
