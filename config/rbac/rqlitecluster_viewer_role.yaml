# This rule is not used by the project rqlite-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to rqlite.example.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: rqlite-operator
    app.kubernetes.io/managed-by: kustomize
  name: rqlitecluster-viewer-role
rules:
- apiGroups:
  - rqlite.example.com
  resources:
  - rqliteclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - rqlite.example.com
  resources:
  - rqliteclusters/status
  verbs:
  - get
