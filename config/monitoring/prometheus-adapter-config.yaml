apiVersion: v1
kind: ConfigMap
metadata:
  name: adapter-config
  namespace: monitoring
data:
  config.yaml: |
    rules:
    - seriesQuery: 'rqlite_requests_per_second{type="total"}'
      resources:
        overrides:
          exported_namespace: {resource: "namespace"}
          node: {resource: "pod"}
      name:
        matches: "^rqlite_requests_per_second"
        as: "rqlite_requests_per_second"
      metricsQuery: 'sum(<<.Series>>{<<.LabelMatchers>>,type="total"}) by (exported_namespace)'
    
    - seriesQuery: 'rqlite:requests_per_second_per_pod'
      resources:
        overrides:
          cluster: {resource: "namespace"}
          node: {resource: "pod"}
      name:
        matches: "^rqlite:requests_per_second_per_pod"
        as: "rqlite_requests_per_second_per_pod"
      metricsQuery: 'avg_over_time(<<.Series>>{<<.LabelMatchers>>}[2m])'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-metrics-apiserver
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: custom-metrics-apiserver
  template:
    metadata:
      labels:
        app: custom-metrics-apiserver
    spec:
      containers:
      - name: custom-metrics-apiserver
        image: k8s.gcr.io/prometheus-adapter/prometheus-adapter:v0.11.2
        args:
        - --secure-port=6443
        - --tls-cert-file=/var/run/serving-cert/tls.crt
        - --tls-private-key-file=/var/run/serving-cert/tls.key
        - --logtostderr=true
        - --prometheus-url=http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090/
        - --metrics-relist-interval=1m
        - --v=4
        - --config=/etc/adapter/config.yaml
        ports:
        - containerPort: 6443
        volumeMounts:
        - mountPath: /var/run/serving-cert
          name: volume-serving-cert
          readOnly: true
        - mountPath: /etc/adapter/
          name: config
          readOnly: true
      volumes:
      - name: volume-serving-cert
        secret:
          secretName: cm-adapter-serving-certs
      - name: config
        configMap:
          name: adapter-config